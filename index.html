<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KENJAGAMES // Finder Tools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #ffffff; font-family: 'Courier New', monospace; }
    header { padding: 20px 40px; border-bottom: 1px solid #333; }
    header h1 { color: #ff2d6b; font-size: 20px; letter-spacing: 2px; }
    header p { color: #888; font-size: 12px; margin-top: 4px; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid #333; padding: 0 40px; }
    .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: #888; padding: 14px 24px; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; margin-bottom: -1px; }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active { color: #00ff88; border-bottom-color: #00ff88; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .container { max-width: 960px; margin: 40px auto; padding: 0 20px; }
    .card { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 30px; margin-bottom: 20px; }
    .card h2 { color: #00ff88; font-size: 13px; letter-spacing: 3px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-group label { font-size: 11px; color: #888; letter-spacing: 1px; }
    .form-group input { background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; }
    .form-group input:focus { outline: none; border-color: #00ff88; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .keywords-section { margin-bottom: 16px; }
    .keywords-section label { font-size: 11px; color: #888; letter-spacing: 1px; display: block; margin-bottom: 8px; }
    .keyword-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .keyword-row input { flex: 1; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 13px; }
    .keyword-row input:focus { outline: none; border-color: #00ff88; }
    .keyword-num { color: #00ff88; font-size: 11px; width: 20px; flex-shrink: 0; }
    .markets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .market-btn { background: #0a0a0a; border: 1px solid #333; color: #888; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: 'Courier New', monospace; transition: all 0.2s; }
    .market-btn.active { background: #00ff88; border-color: #00ff88; color: #000; font-weight: bold; }
    .search-btn { width: 100%; margin-top: 20px; background: #ff2d6b; border: none; color: #fff; padding: 14px; border-radius: 4px; font-size: 14px; letter-spacing: 2px; cursor: pointer; font-family: 'Courier New', monospace; transition: background 0.2s; }
    .search-btn:hover { background: #e0255f; }
    .search-btn:disabled { background: #444; cursor: not-allowed; }
    .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .results-header span { color: #888; font-size: 12px; }
    .status { text-align: center; padding: 40px; color: #888; font-size: 13px; }
    .progress { color: #00ff88; font-size: 12px; margin-bottom: 8px; }
    .legend { font-size: 11px; color: #888; margin-bottom: 16px; }
    .legend span { color: #00ff88; }

    /* ── Seller Table ── */
    .seller-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .seller-table th {
      color: #555;
      text-align: center;
      padding: 8px 10px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 10px;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .seller-table th.left { text-align: left; }
    .seller-table td {
      padding: 10px;
      border-bottom: 1px solid #1a1a1a;
      color: #ccc;
      vertical-align: middle;
      text-align: center;
    }
    .seller-table td.left { text-align: left; }
    .seller-table tr:hover td { background: #161616; }
    .seller-table tr.priority-row td:first-child { border-left: 2px solid #00ff88; }

    .seller-name-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .seller-name-wrap a { color: #00ff88; text-decoration: none; font-size: 12px; }
    .seller-name-wrap a:hover { text-decoration: underline; }
    .priority-badge { background: #00ff88; color: #000; font-size: 9px; padding: 1px 5px; border-radius: 2px; font-weight: bold; white-space: nowrap; }

    /* Contact cell icons */
    .contact-cell { display: flex; justify-content: center; align-items: center; }
    .contact-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 22px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      text-decoration: none;
      cursor: default;
    }
    .contact-icon.unknown { color: #333; font-size: 13px; }
    .contact-icon.found   { cursor: pointer; }
    .contact-icon.not-found { color: #2a2a2a; font-size: 13px; }

    .icon-web.found   { background: #1f3a2a; color: #00ff88; border: 1px solid #00ff88; }
    .icon-ig.found    { background: #3a1520; color: #e1306c; border: 1px solid #e1306c; }
    .icon-fb.found    { background: #101e3a; color: #1877f2; border: 1px solid #1877f2; }
    .icon-email.found { background: #2a2010; color: #f59e0b; border: 1px solid #f59e0b; }
    .icon-wa.found    { background: #0d2a1a; color: #25d366; border: 1px solid #25d366; }
    .icon-x.found     { background: #1a1a1a; color: #fff;    border: 1px solid #555; }

    .market-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    .market-tag { font-size: 9px; padding: 1px 5px; border-radius: 2px; background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; white-space: nowrap; }

    .rating-high { color: #00ff88; }
    .rating-mid  { color: #f59e0b; }
    .rating-low  { color: #888; }

    .msg-btn { background: #1a1a1a; border: 1px solid #00ff88; color: #00ff88; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 10px; font-family: 'Courier New', monospace; white-space: nowrap; }
    .msg-btn:hover { background: #00ff88; color: #000; }

    /* Shop Finder UI */
    .country-group { margin-bottom: 14px; }
    .country-group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .country-group-label { font-size: 11px; color: #555; letter-spacing: 1px; }
    .select-all-btn { font-size: 10px; color: #444; background: none; border: none; cursor: pointer; font-family: 'Courier New', monospace; padding: 0; }
    .select-all-btn:hover { color: #888; }
    .country-grid { display: flex; flex-wrap: wrap; gap: 6px; }
    .country-chip { display: flex; align-items: center; gap: 4px; background: #0a0a0a; border: 1px solid #2a2a2a; color: #666; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px; font-family: 'Courier New', monospace; transition: all 0.15s; user-select: none; }
    .country-chip:hover { border-color: #444; color: #aaa; }
    .country-chip.active { background: #0f2a1a; border-color: #00ff88; color: #00ff88; }
    .angle-card { background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 4px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; }
    .angle-card:hover { border-color: #444; }
    .angle-card.active { background: #0f1f2a; border-color: #00aaff; }
    .angle-card-label { font-size: 12px; color: #ccc; margin-bottom: 3px; }
    .angle-card.active .angle-card-label { color: #00aaff; }
    .angle-card-desc { font-size: 10px; color: #555; line-height: 1.4; }
    .angle-card-query { font-size: 9px; color: #333; margin-top: 4px; font-style: italic; }
    .angle-card.active .angle-card-query { color: #1a4a6a; }

    /* Shop results */
    .shop-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .shop-table th { color: #555; text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2a2a; font-size: 10px; letter-spacing: 1px; white-space: nowrap; }
    .shop-table td { padding: 10px; border-bottom: 1px solid #1a1a1a; color: #ccc; vertical-align: top; }
    .shop-table tr:hover td { background: #161616; }
    .shop-table td a { color: #00ff88; text-decoration: none; font-size: 12px; }
    .shop-table td a:hover { text-decoration: underline; }
    .platform-badge { font-size: 10px; padding: 2px 7px; border-radius: 3px; font-weight: bold; }
    .badge-ig-shop { background: #3a1520; color: #e1306c; border: 1px solid #e1306c; }
    .badge-fb-shop { background: #101e3a; color: #1877f2; border: 1px solid #1877f2; }
    .badge-ebay { background: #2a1010; color: #e53238; border: 1px solid #e53238; }
    .badge-etsy { background: #2a1800; color: #f56400; border: 1px solid #f56400; }
    .badge-web-shop { background: #1a1a1a; color: #666; border: 1px solid #333; }
    .region-badge { font-size: 10px; padding: 2px 8px; border-radius: 3px; background: #1a1a1a; border: 1px solid #333; color: #888; white-space: nowrap; }
    .angle-badge { font-size: 10px; padding: 2px 8px; border-radius: 3px; background: #0f1f2a; border: 1px solid #1a4a6a; color: #00aaff; white-space: nowrap; margin-top: 4px; display: inline-block; }
    .snippet-text { font-size: 11px; color: #555; margin-top: 4px; line-height: 1.4; }
    .url-text { font-size: 10px; color: #444; margin-top: 2px; }

    /* Modal */
    .msg-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .msg-modal.active { display: flex; }
    .msg-box { background: #141414; border: 1px solid #333; border-radius: 8px; padding: 30px; width: 90%; max-width: 640px; max-height: 80vh; overflow-y: auto; }
    .msg-box h3 { color: #00ff88; font-size: 13px; letter-spacing: 2px; margin-bottom: 16px; }
    .msg-box textarea { width: 100%; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; resize: vertical; min-height: 280px; }
    .msg-box textarea:focus { outline: none; border-color: #00ff88; }
    .msg-actions { display: flex; gap: 10px; margin-top: 12px; }
    .copy-btn { flex: 1; background: #00ff88; border: none; color: #000; padding: 10px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; }
    .close-btn { background: #333; border: none; color: #fff; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 12px; }
    .generating { color: #888; font-size: 12px; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>KENJAGAMES // Finder Tools</h1>
    <p>潜在取引先発掘ツール</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('ebay', event)">📦 eBay Seller Finder</button>
    <button class="tab-btn" onclick="switchTab('shop', event)">🌐 Shop Finder</button>
  </div>

  <div id="tab-ebay" class="tab-panel active">
    <div class="container">
      <div class="card">
        <h2>▸ SEARCH CONFIG</h2>
        <div class="keywords-section">
          <label>KEYWORDS（最大3つ・結果は合算されます）</label>
          <div class="keyword-row"><span class="keyword-num">1.</span><input type="text" id="keyword1" placeholder="例: Game Boy Color Junk" value="Game Boy Color Junk"></div>
          <div class="keyword-row"><span class="keyword-num">2.</span><input type="text" id="keyword2" placeholder="例: Game Boy Advance For Parts"></div>
          <div class="keyword-row"><span class="keyword-num">3.</span><input type="text" id="keyword3" placeholder="例: Nintendo DS Not Working"></div>
        </div>
        <div class="form-grid">
          <div class="form-group"><label>MIN FEEDBACK</label><input type="number" id="minFeedback" placeholder="例: 500" value="500"></div>
          <div class="form-group"><label>MAX RESULTS（キーワードごと）</label><input type="number" id="itemsPerPage" placeholder="例: 100" value="100"></div>
        </div>
        <div style="margin-top:16px;">
          <label style="font-size:11px; color:#888; letter-spacing:1px;">MARKETS</label>
          <div class="markets">
            <button class="market-btn active" data-id="EBAY-US">🇺🇸 US</button>
            <button class="market-btn active" data-id="EBAY-GB">🇬🇧 UK</button>
            <button class="market-btn active" data-id="EBAY-AU">🇦🇺 AU</button>
            <button class="market-btn active" data-id="EBAY-DE">🇩🇪 DE</button>
            <button class="market-btn active" data-id="EBAY-FR">🇫🇷 FR</button>
            <button class="market-btn active" data-id="EBAY-CA">🇨🇦 CA</button>
          </div>
        </div>
        <button class="search-btn" id="searchBtn" onclick="startSearch()">🔍 SEARCH SELLERS</button>
      </div>

      <div class="card" id="resultsCard" style="display:none;">
        <div class="results-header"><h2>▸ RESULTS</h2><span id="resultCount"></span></div>
        <div class="legend">
          ⭐ <span>優先セラー</span>：Game / Games / Gaming / Handheld / Retro / Console / Vintage / Nintendo / Mario がユーザー名に含まれるセラー（日本除外済み）
          &nbsp;／&nbsp; SNSアイコン: カラー = 確認済み &nbsp; — = 未取得
        </div>
        <div id="progressLog"></div>
        <div id="resultsBody"></div>
      </div>
    </div>
  </div>

  <div id="tab-shop" class="tab-panel">
    <div class="container">
      <div class="card">
        <h2>▸ SHOP SEARCH CONFIG</h2>

        <!-- キーワード入力 -->
        <div class="form-group" style="margin-bottom:20px;">
          <label>SEARCH KEYWORD</label>
          <div style="display:flex; gap:8px;">
            <input type="text" id="shopKeyword" placeholder="例: retro handheld console" value="retro handheld console" style="flex:1; background:#0a0a0a; border:1px solid #333; color:#fff; padding:10px; border-radius:4px; font-family:'Courier New',monospace; font-size:13px;">
            <button id="suggestBtn" onclick="suggestAngles()" style="background:#1a1a1a; border:1px solid #00ff88; color:#00ff88; padding:10px 16px; border-radius:4px; cursor:pointer; font-family:'Courier New',monospace; font-size:12px; white-space:nowrap;">🔮 切り口を提案</button>
          </div>
        </div>

        <!-- 切り口選択（提案後に表示） -->
        <div id="anglesSection" style="display:none; margin-bottom:20px;">
          <label style="font-size:11px; color:#888; letter-spacing:1px; display:block; margin-bottom:8px;">検索の切り口 <span style="color:#555;">（選択した切り口 × 選択した国で検索）</span></label>
          <div id="anglesList" style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"></div>
        </div>

        <!-- 国選択 -->
        <div style="margin-bottom:20px;">
          <label style="font-size:11px; color:#888; letter-spacing:1px; display:block; margin-bottom:10px;">対象の国</label>
          <div id="countryGroups"></div>
        </div>

        <!-- コンボ数表示 -->
        <div id="comboCount" style="font-size:11px; color:#555; margin-bottom:12px;"></div>

        <button class="search-btn" id="shopSearchBtn" onclick="startShopSearch()" disabled>🔍 SEARCH SHOPS</button>
      </div>

      <div class="card" id="shopResultsCard" style="display:none;">
        <div class="results-header"><h2>▸ RESULTS</h2><span id="shopResultCount"></span></div>
        <div id="shopProgressLog"></div>
        <div id="shopResultsBody"></div>
      </div>
    </div>
  </div>

  <div class="msg-modal" id="msgModal">
    <div class="msg-box">
      <h3>▸ GENERATED MESSAGE</h3>
      <div id="msgContent"></div>
      <div class="msg-actions">
        <button class="copy-btn" onclick="copyMessage()">📋 COPY MESSAGE</button>
        <button class="close-btn" onclick="closeModal()">CLOSE</button>
      </div>
    </div>
  </div>

  <script>
    function switchTab(name, e) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      e.target.classList.add('active');
    }

    const countryFlags = { 'US':'🇺🇸','GB':'🇬🇧','AU':'🇦🇺','DE':'🇩🇪','FR':'🇫🇷','CA':'🇨🇦','JP':'🇯🇵','CN':'🇨🇳','IT':'🇮🇹','ES':'🇪🇸','NL':'🇳🇱','HK':'🇭🇰' };
    const PRIORITY_KEYWORDS = ['game','games','gaming','handheld','retro','console','consoles','vintage','nintendo','mario'];

    const MARKET_LABELS = {
      'EBAY-US': '🇺🇸 US', 'EBAY-GB': '🇬🇧 UK', 'EBAY-AU': '🇦🇺 AU',
      'EBAY-DE': '🇩🇪 DE', 'EBAY-FR': '🇫🇷 FR', 'EBAY-CA': '🇨🇦 CA'
    };

    function getSellerUrl(username, market) {
      const domainMap = { 'EBAY-US':'https://www.ebay.com','EBAY-GB':'https://www.ebay.co.uk','EBAY-AU':'https://www.ebay.com.au','EBAY-DE':'https://www.ebay.de','EBAY-FR':'https://www.ebay.fr','EBAY-CA':'https://www.ebay.ca' };
      return (domainMap[market] || 'https://www.ebay.com') + '/usr/' + username;
    }

    function isPrioritySeller(username) {
      const lower = username.toLowerCase();
      return PRIORITY_KEYWORDS.some(kw => lower.includes(kw));
    }

    document.querySelectorAll('.market-btn').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('active'));
    });

    /**
     * 1セルぶんのアイコンHTMLを返す
     * val: null=未取得, false=なし, string=確認済みURL/値
     */
    function contactCell(val, iconCls, label, isLink) {
      if (val === null) {
        return `<td class="contact-col"><div class="contact-cell"><span class="contact-icon unknown ${iconCls}" title="${label}: 未取得">—</span></div></td>`;
      } else if (val === false) {
        return `<td class="contact-col"><div class="contact-cell"><span class="contact-icon not-found ${iconCls}" title="${label}: なし">—</span></div></td>`;
      } else {
        const tag = isLink ? `a href="${val}" target="_blank"` : 'span';
        const close = isLink ? 'a' : 'span';
        return `<td class="contact-col"><div class="contact-cell"><${tag} class="contact-icon found ${iconCls}" title="${label}: ${val}">${label}</${close}></div></td>`;
      }
    }

    function buildSellerRow(s) {
      const marketsArr = [...s.markets];
      const kws = [...s.keywords].join(' / ');
      const priority = isPrioritySeller(s.username);
      const flag = countryFlags[s.shipFrom] || '🌐';

      // Option B実装前：全て null（未取得）
      // Option B実装後は s.contactInfo で置き換えるだけ
      const ci = { web: null, ig: null, fb: null, email: null, wa: null, x: null };

      const ratingCls = parseFloat(s.feedbackPercentage) >= 99 ? 'rating-high' : parseFloat(s.feedbackPercentage) >= 97 ? 'rating-mid' : 'rating-low';
      const marketsHtml = marketsArr.map(m => `<span class="market-tag">${MARKET_LABELS[m] || m}</span>`).join('');

      return `<tr class="${priority ? 'priority-row' : ''}" data-username="${s.username}">
  <td class="left">
    <div class="seller-name-wrap">
      <a href="${getSellerUrl(s.username, marketsArr[0])}" target="_blank">${s.username}</a>
      ${priority ? '<span class="priority-badge">⭐ 優先</span>' : ''}
    </div>
  </td>
  <td>${flag} ${s.shipFrom}</td>
  <td><div class="market-tags">${marketsHtml}</div></td>
  <td>${s.feedbackScore.toLocaleString()}</td>
  <td class="${ratingCls}">${s.feedbackPercentage}%</td>
  <td>${s.itemCount}</td>
  ${contactCell(ci.web,   'icon-web',   'HP',   true)}
  ${contactCell(ci.email, 'icon-email', 'Mail', false)}
  ${contactCell(ci.fb,    'icon-fb',    'FB',   true)}
  ${contactCell(ci.ig,    'icon-ig',    'IG',   true)}
  ${contactCell(ci.x,     'icon-x',     'X',    true)}
  ${contactCell(ci.wa,    'icon-wa',    'WA',   false)}
  <td><button class="msg-btn" onclick="generateMessage('${s.username}','${s.shipFrom}','${marketsArr.join(',')}',${s.feedbackScore},'${s.feedbackPercentage}','${kws.replace(/'/g,"\\'")}')">✉ MSG</button></td>
</tr>`;
    }

    async function startSearch() {
      const keywords = [
        document.getElementById('keyword1').value.trim(),
        document.getElementById('keyword2').value.trim(),
        document.getElementById('keyword3').value.trim(),
      ].filter(k => k !== '');
      const minFeedback = document.getElementById('minFeedback').value || 0;
      const itemsPerPage = document.getElementById('itemsPerPage').value || 100;
      const activeMarkets = [...document.querySelectorAll('.market-btn.active')].map(b => b.dataset.id);
      if (keywords.length === 0) { alert('キーワードを1つ以上入力してください'); return; }
      if (activeMarkets.length === 0) { alert('マーケットを1つ以上選択してください'); return; }

      const btn = document.getElementById('searchBtn');
      btn.disabled = true; btn.textContent = '⏳ SEARCHING...';
      const resultsCard = document.getElementById('resultsCard');
      const progressLog = document.getElementById('progressLog');
      const resultsBody = document.getElementById('resultsBody');
      resultsCard.style.display = 'block';
      resultsBody.innerHTML = '';
      progressLog.innerHTML = '<div class="status">検索中...</div>';

      const allSellers = {};
      let totalRequests = keywords.length * activeMarkets.length;
      let completed = 0;

      for (const keyword of keywords) {
        for (const market of activeMarkets) {
          try {
            progressLog.innerHTML = `<div class="progress">🔍 検索中: "${keyword}" / ${market} (${completed + 1}/${totalRequests})</div>`;
            const res = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}&globalId=${market}&itemsPerPage=${itemsPerPage}&minFeedback=${minFeedback}`);
            const data = await res.json();
            if (data.sellers) {
              for (const seller of data.sellers) {
                const key = seller.username;
                if (!allSellers[key]) allSellers[key] = { ...seller, markets: new Set(), keywords: new Set(), itemCount: 0 };
                allSellers[key].markets.add(market);
                allSellers[key].keywords.add(keyword);
                allSellers[key].itemCount += seller.itemCount;
              }
            }
          } catch (e) { console.error(e); }
          completed++;
        }
      }

      progressLog.innerHTML = '';
      const sellers = Object.values(allSellers).sort((a, b) => {
        const ap = isPrioritySeller(a.username) ? 1 : 0;
        const bp = isPrioritySeller(b.username) ? 1 : 0;
        if (bp !== ap) return bp - ap;
        return b.feedbackScore - a.feedbackScore;
      });

      document.getElementById('resultCount').textContent = `${sellers.length} sellers found`;

      if (sellers.length === 0) {
        resultsBody.innerHTML = '<div class="status">条件に合うセラーが見つかりませんでした</div>';
      } else {
        resultsBody.innerHTML = '<table class="seller-table"><thead><tr><th class="left">SELLER</th><th>SHIP FROM</th><th>MARKETS</th><th>FEEDBACK</th><th>RATING</th><th>ITEMS</th><th>HP</th><th>MAIL</th><th>FB</th><th>IG</th><th>X</th><th>WA</th><th>ACTION</th></tr></thead><tbody>' + sellers.map(buildSellerRow).join('') + '</tbody></table>';
      }

      btn.disabled = false; btn.textContent = '🔍 SEARCH SELLERS';
    }

    // ── 国データ ──
    const COUNTRY_DATA = [
      { region: 'North America', countries: [
        { label: '🇺🇸 USA',     gl: 'us' },
        { label: '🇨🇦 Canada',  gl: 'ca' },
        { label: '🇲🇽 Mexico',  gl: 'mx' },
      ]},
      { region: 'Europe', countries: [
        { label: '🇬🇧 UK',          gl: 'gb' },
        { label: '🇩🇪 Germany',     gl: 'de' },
        { label: '🇫🇷 France',      gl: 'fr' },
        { label: '🇮🇹 Italy',       gl: 'it' },
        { label: '🇪🇸 Spain',       gl: 'es' },
        { label: '🇳🇱 Netherlands', gl: 'nl' },
        { label: '🇧🇪 Belgium',     gl: 'be' },
        { label: '🇨🇭 Switzerland', gl: 'ch' },
        { label: '🇵🇹 Portugal',    gl: 'pt' },
        { label: '🇵🇱 Poland',      gl: 'pl' },
      ]},
      { region: 'Oceania', countries: [
        { label: '🇦🇺 Australia',    gl: 'au' },
        { label: '🇳🇿 New Zealand',  gl: 'nz' },
      ]},
      { region: 'Middle East', countries: [
        { label: '🇦🇪 UAE',          gl: 'ae' },
        { label: '🇸🇦 Saudi Arabia', gl: 'sa' },
        { label: '🇮🇱 Israel',       gl: 'il' },
        { label: '🇹🇷 Turkey',       gl: 'tr' },
      ]},
      { region: 'Asia', countries: [
        { label: '🇸🇬 Singapore',    gl: 'sg' },
        { label: '🇭🇰 Hong Kong',    gl: 'hk' },
        { label: '🇹🇼 Taiwan',       gl: 'tw' },
        { label: '🇰🇷 South Korea',  gl: 'kr' },
        { label: '🇵🇭 Philippines',  gl: 'ph' },
        { label: '🇹🇭 Thailand',     gl: 'th' },
        { label: '🇮🇩 Indonesia',    gl: 'id' },
        { label: '🇲🇾 Malaysia',     gl: 'my' },
      ]},
    ];

    let selectedAngles = [];

    function initCountryUI() {
      const container = document.getElementById('countryGroups');
      container.innerHTML = COUNTRY_DATA.map(group => `
        <div class="country-group">
          <div class="country-group-header">
            <span class="country-group-label">${group.region.toUpperCase()}</span>
            <button class="select-all-btn" onclick="toggleRegion('${group.region}')">全選択</button>
          </div>
          <div class="country-grid">
            ${group.countries.map(c => `
              <div class="country-chip" data-gl="${c.gl}" data-region="${group.region}" data-label="${c.label}" onclick="toggleCountry(this)">
                ${c.label}
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
      updateComboCount();
    }

    function toggleCountry(el) {
      el.classList.toggle('active');
      updateComboCount();
      updateSearchBtn();
    }

    function toggleRegion(region) {
      const chips = document.querySelectorAll(`.country-chip[data-region="${region}"]`);
      const allActive = [...chips].every(c => c.classList.contains('active'));
      chips.forEach(c => c.classList[allActive ? 'remove' : 'add']('active'));
      updateComboCount();
      updateSearchBtn();
    }

    function getSelectedCountries() {
      return [...document.querySelectorAll('.country-chip.active')].map(c => ({
        label: c.dataset.label,
        gl: c.dataset.gl,
        region: c.dataset.region,
      }));
    }

    function updateComboCount() {
      const countries = getSelectedCountries();
      const angles = selectedAngles.length;
      const combos = Math.min(angles * countries.length, 12);
      const el = document.getElementById('comboCount');
      if (angles === 0 || countries.length === 0) {
        el.textContent = '';
        return;
      }
      const total = angles * countries.length;
      const capped = total > 12 ? `（12件にカット）` : '';
      el.innerHTML = `選択中: 切り口 ${angles} × 国 ${countries.length} = <span style="color:#00ff88;">${combos} コンボ</span> ${capped}`;
    }

    function updateSearchBtn() {
      const countries = getSelectedCountries();
      const btn = document.getElementById('shopSearchBtn');
      btn.disabled = !(selectedAngles.length > 0 && countries.length > 0);
    }

    async function suggestAngles() {
      const keyword = document.getElementById('shopKeyword').value.trim();
      if (!keyword) { alert('キーワードを入力してください'); return; }
      const btn = document.getElementById('suggestBtn');
      btn.disabled = true; btn.textContent = '⏳ 提案中...';
      try {
        const res = await fetch('/api/suggest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ keyword })
        });
        const data = await res.json();
        if (!data.angles) throw new Error(data.error || '不明なエラー');

        selectedAngles = data.angles;
        const section = document.getElementById('anglesSection');
        const list = document.getElementById('anglesList');
        section.style.display = 'block';
        list.innerHTML = data.angles.map((a, i) => `
          <div class="angle-card active" data-index="${i}" onclick="toggleAngle(this, ${i})">
            <div class="angle-card-label">${a.label}</div>
            <div class="angle-card-desc">${a.description}</div>
            <div class="angle-card-query">${a.query}</div>
          </div>
        `).join('');
        updateComboCount();
        updateSearchBtn();
      } catch (e) {
        alert('エラー: ' + e.message);
      }
      btn.disabled = false; btn.textContent = '🔮 切り口を提案';
    }

    function toggleAngle(el, index) {
      el.classList.toggle('active');
      const activeIndices = [...document.querySelectorAll('.angle-card.active')].map(c => parseInt(c.dataset.index));
      // selectedAnglesを選択中のもののみに絞る（元データは保持）
      updateComboCount();
      updateSearchBtn();
    }

    function getSelectedAngles() {
      const activeCards = [...document.querySelectorAll('.angle-card.active')];
      return activeCards.map(c => selectedAngles[parseInt(c.dataset.index)]).filter(Boolean);
    }

    async function startShopSearch() {
      const angles = getSelectedAngles();
      const countries = getSelectedCountries();
      if (angles.length === 0 || countries.length === 0) { alert('切り口と国を選択してください'); return; }

      const btn = document.getElementById('shopSearchBtn');
      btn.disabled = true; btn.textContent = '⏳ SEARCHING...';
      const card = document.getElementById('shopResultsCard');
      const progressLog = document.getElementById('shopProgressLog');
      const body = document.getElementById('shopResultsBody');
      card.style.display = 'block';
      body.innerHTML = '';
      progressLog.innerHTML = '<div class="status">検索中... (Google API消費中)</div>';

      try {
        const res = await fetch('/api/shop-search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ angles, countries })
        });
        const data = await res.json();
        progressLog.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          body.innerHTML = '<div class="status">結果が見つかりませんでした</div>';
        } else {
          document.getElementById('shopResultCount').textContent = `${data.results.length} results found (${data.combos} combos)`;
          let html = '<table class="shop-table"><thead><tr><th>REGION</th><th>ANGLE</th><th>TITLE / URL</th><th>TYPE</th><th>SNIPPET</th></tr></thead><tbody>';
          data.results.forEach(item => {
            const badge = item.isInstagram ? '<span class="platform-badge badge-ig-shop">IG</span>'
              : item.isFacebook ? '<span class="platform-badge badge-fb-shop">FB</span>'
              : item.isEbay ? '<span class="platform-badge badge-ebay">eBay</span>'
              : item.isEtsy ? '<span class="platform-badge badge-etsy">Etsy</span>'
              : '<span class="platform-badge badge-web-shop">Web</span>';
            html += `<tr>
              <td><span class="region-badge">${item.country}</span></td>
              <td><span class="angle-badge">${item.angle}</span></td>
              <td><a href="${item.url}" target="_blank">${item.title}</a><div class="url-text">${item.url}</div></td>
              <td>${badge}</td>
              <td><div class="snippet-text">${item.snippet || ''}</div></td>
            </tr>`;
          });
          html += '</tbody></table>';
          body.innerHTML = html;
        }
      } catch (e) {
        body.innerHTML = `<div class="status" style="color:#ff2d6b;">エラー: ${e.message}</div>`;
      }
      btn.disabled = false; btn.textContent = '🔍 SEARCH SHOPS';
      updateSearchBtn();
    }

    // 初期化
    initCountryUI();

    // SNSアイコンを更新する関数
    function updateContactIcons(username, contactInfo) {
      const row = document.querySelector(`tr[data-username="${username}"]`);
      if (!row) return;
      const defs = [
        { key: 'web',   cls: 'icon-web',   label: 'HP',   isLink: true },
        { key: 'email', cls: 'icon-email', label: 'Mail', isLink: false },
        { key: 'fb',    cls: 'icon-fb',    label: 'FB',   isLink: true },
        { key: 'ig',    cls: 'icon-ig',    label: 'IG',   isLink: true },
        { key: 'x',     cls: 'icon-x',     label: 'X',    isLink: true },
        { key: 'wa',    cls: 'icon-wa',    label: 'WA',   isLink: false },
      ];
      const cells = row.querySelectorAll('.contact-col');
      defs.forEach((d, i) => {
        const val = contactInfo[d.key];
        if (val === undefined || val === null) return;
        const cell = cells[i];
        if (!cell) return;
        if (val === false) {
          cell.innerHTML = `<div class="contact-cell"><span class="contact-icon not-found ${d.cls}" title="${d.label}: なし">—</span></div>`;
        } else {
          const tag = d.isLink ? `a href="${val}" target="_blank"` : 'span';
          const close = d.isLink ? 'a' : 'span';
          cell.innerHTML = `<div class="contact-cell"><${tag} class="contact-icon found ${d.cls}" title="${d.label}: ${val}">${d.label}</${close}></div>`;
        }
      });
    }

    async function generateMessage(username, shipFrom, markets, feedback, rating, keywords) {
      document.getElementById('msgModal').classList.add('active');
      document.getElementById('msgContent').innerHTML = '<div class="generating">⏳ SNS情報を取得中... (Web Search)</div>';
      try {
        const response = await fetch('/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, shipFrom, markets, feedback, rating, keywords })
        });
        const data = await response.json();
        if (data.message) {
          document.getElementById('msgContent').innerHTML = `<textarea id="msgText">${data.message}</textarea>`;
          // SNSアイコンを更新
          if (data.contactInfo) updateContactIcons(username, data.contactInfo);
        } else {
          document.getElementById('msgContent').innerHTML = `<div class="generating" style="color:#ff2d6b;">エラー: ${data.error || '不明なエラー'}</div>`;
        }
      } catch (e) {
        document.getElementById('msgContent').innerHTML = `<div class="generating" style="color:#ff2d6b;">エラーが発生しました</div>`;
      }
    }

    function copyMessage() {
      const textarea = document.getElementById('msgText');
      if (textarea) { textarea.select(); document.execCommand('copy'); alert('コピーしました！'); }
    }
    function closeModal() { document.getElementById('msgModal').classList.remove('active'); }
    window.addEventListener('click', (e) => { if (e.target === document.getElementById('msgModal')) closeModal(); });
  </script>
</body>
</html>
